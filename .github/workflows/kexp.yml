name: KEXP John Richards Feed & Playlist

on:
  schedule:
    # Runs every 10 minutes (UTC). Script itself gates to 7–10am PT, Mon–Fri.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: kexp-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_PLAYLIST_ID: ${{ secrets.SPOTIFY_PLAYLIST_ID }}

          # Backfill range (YYYY-MM-DD). Leave END empty = today (PT).
          BACKFILL_START_DATE: "2025-01-01"
          BACKFILL_END_DATE: ""
          FORCE_BACKFILL_ONCE: "0"   # set "1" ONLY to re-run backfill once

          # Optional toggles:
          DO_SPOTIFY_ADDS: "1"       # set "0" to build RSS only (no playlist changes)
          JR_DEBUG: "0"              # set "1" for extra logs during troubleshooting
          JR_SKIP_HOST_CHECK: "0"    # set "1" to bypass host validation (debug only)

        run: |
          python scripts/run.py
          echo "---- ls -l docs ----" && ls -l docs || true
          echo "---- head -n 40 docs/feed.xml ----" && head -n 40 docs/feed.xml || true
          echo "---- tail -n 40 docs/feed.xml ----" && tail -n 40 docs/feed.xml || true

      - name: Ensure data directory and CSV exist (optional)
        run: |
          mkdir -p data
          [ -f data/not_found.csv ] || echo "timestamp_pt,artist,song,reason" > data/not_found.csv

      - name: Commit & push if changed (existence-aware)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage files only if they exist
          [ -f docs/feed.xml ] && git add docs/feed.xml
          [ -f data/seen.json ] && git add data/seen.json
          [ -f data/not_found.csv ] && git add data/not_found.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update feed & playlist $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          git push

      - name: Upload artifacts (feed & data snapshot)
        uses: actions/upload-artifact@v4
        with:
          name: feed-and-data
          path: |
            docs/feed.xml
            data/seen.json
            data/not_found.csv
          if-no-files-found: ignore
